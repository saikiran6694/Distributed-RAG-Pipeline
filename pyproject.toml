[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Kafka ────────────────────────────────────────────────
    "confluent-kafka>=2.4.0",
    # ── Data validation ──────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # ── Database ─────────────────────────────────────────────
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # ── Vector DB ────────────────────────────────────────────
    "qdrant-client>=1.9.0,<1.10.0",
    # ── Document parsing ─────────────────────────────────────
    "unstructured[pdf,docx]>=0.14.0",
    "trafilatura>=1.9.0",
    "python-magic>=0.4.27",
    "chardet>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    # ── Chunking & tokenization ───────────────────────────────
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "nltk>=3.8.0",
    # ── Embedding backends ───────────────────────────────────
    "openai>=1.30.0",
    # ── Observability ─────────────────────────────────────────
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "prometheus-client>=0.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "redis[asyncio]>=7.4.0",
    "doc2txt>=1.0.8",
    "python-multipart>=0.0.26",
    "groq>=1.1.2",
    "docx2txt>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "query", "shared", "ingestion", "infrastructure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
