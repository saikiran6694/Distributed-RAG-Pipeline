name: Phase 1 — Ingestion Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy pydantic pydantic-settings

      # - name: Ruff lint
      #   run: ruff check ingestion/ shared/ tests/

      # - name: Mypy type check
      #   run: mypy ingestion/ shared/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=ingestion --cov=shared --cov-report=term-missing

  integration-test:
    name: Integration test (Docker Compose)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          cd infrastructure
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          POSTGRES_HOST: localhost
          QDRANT_HOST: localhost
          EMBED_BACKEND: huggingface
        run: pytest tests/integration/ -v --timeout=120

      - name: Tear down
        if: always()
        run: cd infrastructure && docker compose down -v
